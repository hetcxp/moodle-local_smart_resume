<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>

    <!-- Core Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0F6CBF"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Warm Amber Accent -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="197" height="197" rx="42.5" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5"/>

  <!-- Subtle Background Grid/Course Lines -->
  <line x1="40" y1="55" x2="160" y2="55" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <line x1="40" y1="85" x2="160" y2="85" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <line x1="40" y1="115" x2="160" y2="115" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Completed Activities Indicator dots -->
  <circle cx="45" cy="55" r="4" fill="#10B981" opacity="0.8"/>
  <circle cx="45" cy="85" r="4" fill="#10B981" opacity="0.8"/>

  <!-- Smart Resume Target Activity Card (Highlighted Container) -->
  <rect x="30" y="104" width="140" height="56" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="#0F6CBF" stroke-width="2.5" filter="url(#softGlow)"/>
  
  <!-- Pulse Wave Rings Behind Resume Icon -->
  <circle cx="70" cy="132" r="22" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.2"/>
  <circle cx="70" cy="132" r="17" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.4"/>

  <!-- Fast-Forward / Resume Play Icons -->
  <path d="M62 122 L72 132 L62 142 Z" fill="url(#cyanGrad)"/>
  <path d="M73 122 L83 132 L73 142 Z" fill="url(#cyanGrad)"/>

  <!-- Content Placeholder Bars on Active Card -->
  <rect x="92" y="125" width="46" height="5" rx="2.5" fill="#F8FAFC"/>
  <rect x="92" y="135" width="30" height="4" rx="2" fill="#94A3B8" opacity="0.7"/>

  <!-- Floating 'NEXT' / Resume Badge (matches plugin badge .local-smart-resume-label) -->
  <g transform="translate(100, 94)">
    <rect width="62" height="18" rx="9" fill="#0F6CBF" stroke="#38BDF8" stroke-width="1" filter="url(#softGlow)"/>
    <!-- Small forward arrow in badge -->
    <path d="M110 100 L115 103 L110 106" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-95, -94)"/>
    <text x="24" y="12.5" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" letter-spacing="0.5">NEXT</text>
  </g>

  <!-- Golden Checkpoint Star (Completion Beacon) -->
  <g transform="translate(142, 36)">
    <path d="M12 0 L15.7 7.5 L24 8.7 L18 14.5 L19.4 22.8 L12 18.9 L4.6 22.8 L6 14.5 L0 8.7 L8.3 7.5 Z" fill="url(#amberGrad)" filter="url(#softGlow)"/>
  </g>
</svg>