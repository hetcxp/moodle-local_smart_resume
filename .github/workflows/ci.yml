name: Moodle Plugin CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  moodle-ci:
    name: Moodle ${{ matrix.moodle-branch }} (PHP ${{ matrix.php }}, ${{ matrix.database }})
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        moodle-branch: ['MOODLE_405_STABLE', 'MOODLE_501_STABLE', 'main']
        database: ['pgsql', 'mariadb']

    steps:
      - name: Check out plugin code
        uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, json, gd, intl, xml, zip, soap, pgsql, pdo_pgsql, mysqli, pdo_mysql
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle & Plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector (PHPMD)
        continue-on-error: true
        run: moodle-plugin-ci phpmd

      - name: Moodle CodeChecker
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: Validate Plugin Structure
        run: moodle-plugin-ci validate

      - name: Savepoints Check
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        run: moodle-plugin-ci mustache

      - name: Grunt & JS/CSS Lint (ESLint / Stylelint)
        id: grunt
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: Upload Rebuilt AMD Bundle on Grunt Failure
        if: failure() && steps.grunt.outcome == 'failure' && matrix.moodle-branch == 'MOODLE_405_STABLE' && matrix.database == 'pgsql'
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-amd-build
          path: |
            moodle/local/smart_resume/amd/build/
            moodle/public/local/smart_resume/amd/build/
          if-no-files-found: ignore

      - name: PHPUnit Tests
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat Acceptance Tests
        id: behat
        run: moodle-plugin-ci behat --profile chrome

      - name: Upload Behat Faildump on Failure
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: behat-faildump-${{ matrix.moodle-branch }}-php${{ matrix.php }}-${{ matrix.database }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
